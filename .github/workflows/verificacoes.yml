name: Verificações

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest (Teste 1)
        run: npm test
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright (Teste 2)
        run: npm run test:e2e
      - name: Postman/Newman (Teste 3)
        run: |
          npm start &
          sleep 3
          npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias
          path: |
            playwright-report/
            docs/evidencias/
